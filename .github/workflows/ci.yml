name: ci
on:
  pull_request:
  push:
    branches: [main, "claude/**", "contrib/**"]
jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -e ".[dev]"
      - run: pytest -q -m "not network"
      - name: contrib cannot touch core results
        run: |
          git diff --exit-code -- results/ ':!results/contrib' || (echo "core results/ changed" && exit 1)
